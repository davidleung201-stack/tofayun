<style>

#zoom{position:absolute;right:calc(16px + var(--sar));bottom:calc(30px + var(--sab));display:flex;flex-direction:column;gap:10px;z-index:5}
body.touch #zoom{right:calc(156px + var(--sar));bottom:calc(44px + var(--sab));flex-direction:row}
.zb{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(245,197,66,.9);border:3px solid var(--ink);color:var(--ink);font-weight:700;font-size:20px;box-shadow:3px 3px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none}
.zb:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
#lockBadge{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + var(--sat));padding:6px 14px;font-size:14px;color:var(--ink);background:rgba(245,197,66,.92);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:none;z-index:6;pointer-events:none;letter-spacing:1px}
#touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:10}
#joy{position:absolute;left:calc(34px + var(--sal));bottom:calc(34px + var(--sab));width:150px;height:150px;border-radius:50%;background:rgba(43,29,14,.45);border:3px solid rgba(245,197,66,.8);pointer-events:auto;touch-action:none}

#camHint{position:absolute;right:calc(160px + var(--sar));bottom:calc(112px + var(--sab));font-size:12px;opacity:.7;text-align:center;pointer-events:none;line-height:1.5}
#rotate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:50;text-align:center;font-size:22px;line-height:2}

</style>

<script>
/* =========================================================
   桃花源記・漁人奇遇  ——  3D 像素風中文教育 RPG（iPad 優化）
   ========================================================= */
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="padding:40px;color:#fff">無法載入 Three.js，請確認網絡連線後重新整理。</p>';throw new Error('THREE missing');}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

// ---------------------- 課文與教學資料 ----------------------
const FULLTEXT=[
'晉太元中，武陵人，捕魚為業。緣溪行，忘路之遠近。忽逢桃花林，夾岸數百步，中無雜樹，芳草鮮美，落英繽紛，漁人甚異之。復前行，欲窮其林。林盡水源，便得一山，山有小口，髣髴若有光。便舍船，從口入。初極狹，才通人。復行數十步，豁然開朗。土地平曠，屋舍儼然，有良田、美池、桑、竹之屬，阡陌交通，雞犬相聞。其中往來種作，男女衣着，悉如外人。黃髮、垂髫，並怡然自樂。',
'見漁人，乃大驚，問所從來。具答之。便要還家，設酒、殺雞，作食。村中聞有此人，咸來問訊。自云：先世避秦時亂，率妻子邑人來此絕境，不復出焉；遂與外人間隔。問今是何世，乃不知有漢，無論魏、晉。此人一一為具言所聞，皆歎惋。餘人各復延至其家，皆出酒食。停數日，辭去。此中人語云：「不足為外人道也。」',
'既出，得其船，便扶向路，處處誌之。及郡下，詣太守，說如此。太守即遣人隨其往，尋向所誌，遂迷，不復得路。',
'南陽劉子驥，高尚士也，聞之，欣然規往，未果，尋病終，後遂無問津者。'];
const ACTS={
1:{title:'第一幕　發現桃花林',
 text:'晉太元中，武陵人，捕魚為業。緣溪行，忘路之遠近。忽逢桃花林，夾岸數百步，中無雜樹，芳草鮮美，落英繽紛，漁人甚異之。復前行，欲窮其林。林盡水源，便得一山，山有小口，髣髴若有光。便舍船，從口入。',
 vocab:[
 {s:'捕魚為業',w:'業',o:['職業、生計','產業、財產','學業','已經'],a:0,e:'「業」指職業、賴以為生的工作，漁人以捕魚維生。'},
 {s:'緣溪行',w:'緣',o:['沿着','緣分','因為','邊緣'],a:0,e:'「緣」作動詞，解作沿着。漁人沿着溪水前行。'},
 {s:'忽逢桃花林',w:'逢',o:['遇到、遇見','迎接','每逢','奉承'],a:0,e:'「逢」即遇到，漁人忽然遇見一片桃花林。'},
 {s:'夾岸數百步',w:'夾岸',o:['溪水的兩岸','夾着岸邊的山','狹窄的河岸','只有一邊的岸上'],a:0,e:'「夾岸」指溪流兩岸，桃花林長在溪水兩旁達數百步。'},
 {s:'落英繽紛',w:'英',o:['花','英雄','精華','樹葉'],a:0,e:'「英」指花，「落英」就是落下的花瓣。'},
 {s:'漁人甚異之',w:'異',o:['對……感到詫異','不同','奇怪的東西','分別'],a:0,e:'「異」在此是意動用法，指對桃花林感到非常詫異。'},
 {s:'復前行',w:'復',o:['又、再','回復','報復','重複多次'],a:0,e:'「復」即又、再，漁人再向前行。'},
 {s:'欲窮其林',w:'窮',o:['走到盡頭','貧窮','窮困','窮盡心力'],a:0,e:'「窮」作動詞，指走到盡頭，漁人想走完桃花林。'},
 {s:'髣髴若有光',w:'髣髴',o:['隱隱約約、好像','清清楚楚','一定','忽然'],a:0,e:'「髣髴」即隱隱約約、好像的樣子，山口隱約似有光。'},
 {s:'便舍船，從口入',w:'舍',o:['捨棄、離開','房舍','施捨','停留'],a:0,e:'「舍」通「捨」，解作捨棄、離開，漁人離船上岸。'}],
 comp:[
 {q:'漁人如何發現桃花林？',o:['沿着溪水前行，忘了路程遠近，忽然遇上桃花林','聽從村人指引前往','在山洞中迷路時發現','追捕一條大魚游進林中'],a:0,e:'課文：「緣溪行，忘路之遠近。忽逢桃花林。」'},
 {q:'桃花林有何特點？',o:['兩岸數百步內只有桃樹，沒有其他樹木，花草鮮美，落花繁多','林中混雜很多不同的樹木','桃花林長在高山頂上','桃花林早已枯萎凋零'],a:0,e:'課文：「夾岸數百步，中無雜樹，芳草鮮美，落英繽紛。」'},
 {q:'為何漁人會捨棄小船？',o:['溪水到了盡頭，前面是山，山有小口似有光，他想進去探看','因為小船破損漏水','因為被村人邀請上岸','因為天色已晚要休息'],a:0,e:'課文：「林盡水源，便得一山，山有小口，髣髴若有光。便舍船，從口入。」'}]},
2:{title:'第二幕　山洞探險',
 text:'初極狹，才通人。復行數十步，豁然開朗。',
 vocab:[
 {s:'才通人',w:'才',o:['僅僅、只','才能','剛才','人才'],a:0,e:'「才」即僅僅、只，洞口狹窄到只能通過一個人。'},
 {s:'豁然開朗',w:'豁',o:['開闊','豁達','免除','缺口'],a:0,e:'「豁」指開闊的樣子。'},

class World{
 constructor(){this.blocks=[];this.waters=[];this.H=new Map();this.T=new Map();this.S=new Set();this.waterMesh=null}
 k(x,z){return x+','+z}
 block(x,y,z,c,s){this.blocks.push([x,y,z,c,s||null])}
 water(x,y,z){this.waters.push([x,y,z])}
 set(x,z,top,type){this.H.set(this.k(x,z),top);this.T.set(this.k(x,z),type)}
 solid(x,z){this.S.add(this.k(x,z))}
 top(x,z){return this.H.get(this.k(x,z))}
 type(x,z){return this.T.get(this.k(x,z))}
 isSolid(x,z){return this.S.has(this.k(x,z))}
 isWater(x,z){return this.type(x,z)==='w'}
 canWalk(x,z,fromY){const t=this.top(x,z);if(t===undefined)return false;if(this.type(x,z)==='w')return false;if(this.isSolid(x,z))return false;return Math.abs(t-fromY)<=1.05}
 build(){
  const g=new THREE.Group();const geo=new THREE.BoxGeometry(1,1,1);
  const m=new THREE.Matrix4(),p=new THREE.Vector3(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),col=new THREE.Color();
  if(this.blocks.length){const im=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0xffffff}),this.blocks.length);
   this.blocks.forEach((b,i)=>{const s=b[4]||[1,1,1];p.set(b[0]+0.5,b[1]+s[1]/2,b[2]+0.5);sc.set(s[0],s[1],s[2]);m.compose(p,q,sc);im.setMatrixAt(i,m);im.setColorAt(i,col.set(b[3]))});
   im.castShadow=true;im.receiveShadow=true;g.add(im)}
  if(this.waters.length){const im=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0x4a9ae6,transparent:true,opacity:0.78}),this.waters.length);
   sc.set(1,0.85,1);this.waters.forEach((b,i)=>{p.set(b[0]+0.5,b[1]+0.425,b[2]+0.5);m.compose(p,q,sc);im.setMatrixAt(i,m)});im.receiveShadow=true;g.add(im);this.waterMesh=im}
  buildMinimapBase(this);return g;
 }

// 座標系說明：Three.js 為右手座標系，鏡頭預設朝 +z 看時畫面右方是 −x。
// 因此小地圖以「+z 朝上、+x 朝左」繪製（即從正上方俯視），與畫面方向一致。
function buildMinimapBase(w){
 let minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;const cells=[];
 for(const [k,top] of w.H){const i=k.indexOf(',');const x=+k.slice(0,i),z=+k.slice(i+1);if(x<minx)minx=x;if(x>maxx)maxx=x;if(z<minz)minz=z;if(z>maxz)maxz=z;cells.push([x,z,w.T.get(k),w.S.has(k)])}
 if(!cells.length)return;const W=maxx-minx+1,D=maxz-minz+1;const cv=document.createElement('canvas');cv.width=W;cv.height=D;const c=cv.getContext('2d');
 for(const [x,z,ty,so] of cells){c.fillStyle=ty==='w'?'#3f8fe0':ty==='s'?'#d9c27a':ty==='r'?'#3c3c42':(so?'#2f6b25':'#58a03f');c.fillRect(maxx-x,maxz-z,1,1)}
 mm.base=cv;mm.b={minx,maxx,minz,maxz,W,D};
}

function updateTextPanel(){const el=$('textPanel');el.innerHTML='<h3 style="color:#f5c542;margin-bottom:8px">《桃花源記》陶淵明　<span style="float:right;cursor:pointer" id="closeText">✕</span></h3>'+FULLTEXT.map(p=>'<p>'+p+'</p>').join('')+(act?'<h3 style="color:#f5c542;margin:10px 0 6px">本幕原文</h3><p class="cur">'+(ACTS[act].text||'').replace(/\n/g,'<br>')+'</p>':'');$('closeText').onclick=()=>el.style.display='none'}
function showIntro(a,onStart){$('overlay').innerHTML='<div class="panel pixel big"><h2>'+a.title+'</h2><p class="classic">'+a.text.replace(/\n/g,'<br>')+'</p><div style="text-align:center"><button class="btn" id="introBtn">開始本幕 ▶</button></div></div>';$('overlay').style.display='flex';$('introBtn').onclick=()=>{$('overlay').style.display='none';onStart()}}
function showTitle(){mode='title';scene.background=new THREE.Color(0x1a1208);$('overlay').innerHTML='<div class="panel pixel"><h1>桃花源記</h1><p style="font-size:20px;color:#f5c542;letter-spacing:4px;margin:6px 0 14px">漁人奇遇・3D 中文教育 RPG</p><p>你將代入<b>武陵漁人</b>，沿溪而行、誤入桃花源、作客數日、處處誌之、再尋無果——在六幕情節中掌握《桃花源記》的重點字詞與內容。</p><table class="keys">'+(isTouch?'<tr><td>左下搖桿</td><td>移動（駕船 / 步行）</td></tr><tr><td>單指在畫面上拖曳</td><td>360° 旋轉 / 俯仰鏡頭</td></tr><tr><td>雙指開合 或 🔍+ 🔍−</td><td>拉近 / 推遠鏡頭（⟲ 重置）</td></tr><tr><td>右下「E」鍵 / 點黃色提示</td><td>對話、上岸、登船、做標記</td></tr><tr><td>點對話框 / 點選項</td><td>繼續對話 / 選擇話題</td></tr>':'<tr><td>W / A / S / D</td><td>移動（駕船 / 步行）</td></tr><tr><td>滑鼠拖曳 或 ← → ↑ ↓</td><td>360° 旋轉 / 俯仰鏡頭</td></tr><tr><td>滑鼠滾輪 或 + / −</td><td>拉近 / 推遠鏡頭（⟲ 重置）</td></tr><tr><td>E / Space / Enter</td><td>對話、上岸、登船、做標記、繼續</td></tr><tr><td>1 / 2 / 3</td><td>選擇對話選項</td></tr>')+'<tr><td>小地圖（右上）</td><td>🟡字詞卷　⚪未對話村民　🔶標記處　🟢本幕目標　點地圖可放大</td></tr><tr><td>🔒 第二幕山洞</td><td>洞道狹窄，鏡頭固定為跟隨視角</td></tr></table><p style="font-size:13px;opacity:.75">'+(isTouch?'建議 iPad 橫向、全螢幕（右上 ⛶）遊玩｜':'')+'依《桃花源記場景劃分及學習重點安排》設計｜像素方塊風格</p><button class="btn" id="startBtn">開始遊戲 ▶</button></div>';$('overlay').style.display='flex';$('startBtn').onclick=()=>{getCtx();musicStart();beep(660,.1);$('overlay').style.display='none';startAct(1)}}
function showEnding(){mode='ending';const vp=stats.vT?Math.round(stats.vF/stats.vT*100):0,cp=stats.cT?Math.round(stats.cF/stats.cT*100):0;$('overlay').innerHTML='<div class="panel pixel"><h2>後遂無問津者……</h2><p class="classic" style="text-align:left">'+FULLTEXT.join('<br>')+'</p><h3 style="text-align:center;border:none">學習成績</h3><p>📖 重點字詞：首次答對 <b style="color:#f5c542">'+stats.vF+' / '+stats.vT+'</b>（'+vp+'%）<br>📝 內容理解：首次答對 <b style="color:#f5c542">'+stats.cF+' / '+stats.cT+'</b>（'+cp+'%）</p><p style="font-size:14px;opacity:.85">桃花源究竟在哪裏？也許，它只存在於每個嚮往和平安樂的人心中。</p><button class="btn" id="againBtn">重新開始 ↻</button></div>';$('overlay').style.display='flex';$('againBtn').onclick=()=>location.reload()}

// ---------------------- 輸入 ----------------------
function tapAction(){if(mode==='dialog')advanceDialog();else if(mode==='cutscene')skipCutStep();else if(mode==='passage')dismissPassage()}
function bindInput(){
 addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Equal','Minus'].includes(e.code))e.preventDefault();if(e.repeat)return;
  if(choosing&&/^Digit[1-4]$/.test(e.code)){const b=$('dlgOpts').children[+e.code.slice(5)-1];if(b)b.click();return}
  if(mode==='dialog'&&['Enter','Space','KeyE'].includes(e.code))advanceDialog();
  else if(mode==='play'&&['KeyE','Space','Enter'].includes(e.code))interact();
  else if(mode==='cutscene'&&['Enter','Space'].includes(e.code))skipCutStep();
  else if(mode==='passage'&&['Enter','Space','KeyE'].includes(e.code))dismissPassage()});
 addEventListener('keyup',e=>{keys[e.code]=false});
 const cv=$('c');const pts=new Map();let drag=null,pinch=null;
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
  else if(pts.size===2){const [a,b]=[...pts.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),dist0:camDist};if(drag)drag.moved=true}});
 cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(pinch&&pts.size>=2){if(camLocked){lockNotice();return}const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>10)camDist=clamp(pinch.dist0*pinch.d0/d,CAM.minD,CAM.maxD);return}
  if(drag&&e.pointerId===drag.id){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
   if(camLocked){if(drag.moved)lockNotice()}
   else if(mode==='play'||mode==='passage'||mode==='dialog'){camYaw-=dx*(isTouch?0.008:0.006);camPitch=clamp(camPitch+dy*(isTouch?0.006:0.005),CAM.minP,CAM.maxP)}
   drag.x=e.clientX;drag.y=e.clientY}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(drag&&e.pointerId===drag.id){if(!drag.moved)tapAction();drag=null}};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',e=>{if(pts.has(e.pointerId))up(e)});
 cv.addEventListener('wheel',e=>{e.preventDefault();if(camLocked){lockNotice();return}camDist=clamp(camDist+e.deltaY*0.02,CAM.minD,CAM.maxD)},{passive:false});
 [['zIn',-1],['zOut',1]].forEach(([id,d])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();zoomDir=d;try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>zoomDir=0))});
 $('zReset').addEventListener('click',()=>{if(camLocked){lockNotice();return}camPitch=CAM.defP;camDist=camDistDefault;toast('鏡頭已重置',1200)});
 $('dialog').addEventListener('click',advanceDialog);$('subtitle').addEventListener('click',skipCutStep);
 $('passageBox').addEventListener('click',dismissPassage);
 $('prompt').addEventListener('click',interact);
 $('btnText').onclick=()=>{const el=$('textPanel');updateTextPanel();el.style.display=el.style.display==='block'?'none':'block'};
 $('btnHelp').onclick=()=>toast(isTouch?'左下搖桿移動｜單指拖曳 360° 轉鏡頭｜雙指開合或 🔍 鍵縮放｜右下 E 鍵對話・上岸・登船・做標記｜對話中點選項可選擇話題｜第二幕山洞鏡頭固定｜小地圖：🟡字詞卷 ⚪未對話村民 🔶標記處 🟢目標':'W/A/S/D 移動｜滑鼠拖曳或方向鍵轉鏡頭｜滾輪或 +/− 縮放｜E 對話・上岸・登船・做標記｜1/2/3 選擇對話選項｜第二幕山洞鏡頭固定｜小地圖：🟡字詞卷 ⚪未對話村民 🔶標記處 🟢目標',6000);
 $('btnMusic').onclick=()=>{getCtx();musicStart();musicToggle()};
 $('btnFull').onclick=()=>{const d=document.documentElement;const fs=document.fullscreenElement||document.webkitFullscreenElement;try{if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}}catch(e){toast('此瀏覽器不支援全螢幕，可用 Safari「加入主畫面」後開啟')}};
 $('mmWrap').addEventListener('click',()=>$('mmWrap').classList.toggle('big'));
 document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('gesturechange',e=>e.preventDefault());
 if(isTouch){document.body.classList.add('touch');$('touch').style.display='block';bindJoystick();
  const act=$('tAct');act.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='dialog')advanceDialog();else if(mode==='play')interact();else if(mode==='cutscene')skipCutStep();else if(mode==='passage')dismissPassage()})}
}
function bindJoystick(){const base=$('joy'),knob=$('joyKnob');const RAD=55;
 const move=e=>{let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy);if(d>RAD){dx*=RAD/d;dy*=RAD/d}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/RAD;joy.y=dy/RAD};
 base.addEventListener('pointerdown',e=>{if(joy.id!==null)return;e.preventDefault();joy.id=e.pointerId;try{base.setPointerCapture(e.pointerId)}catch(_){}const r=base.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;move(e)});
 base.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)move(e)});
 const end=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'};
 base.addEventListener('pointerup',end);base.addEventListener('pointercancel',end);base.addEventListener('lostpointercapture',end);
}
init();
</script>
