<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="桃花源記字卡">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fde8ec">
<meta name="format-detection" content="telephone=no">
<title>桃花源記 ‧ 文言字詞字卡遊戲</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2522;--paper:#fffaf3;--peach:#f7a8b8;--peach2:#e0607e;--peach3:#fbe3e8;
  --leaf:#5f8f5a;--gold:#c9a24a;--muted:#7a6f68;--ok:#3a9d5d;--bad:#d9534f;--line:rgba(60,30,30,.10);
  --violet:#6b5bb5;--violet3:#ece8fa;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{font-family:'Noto Serif TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',serif;color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;
  background:linear-gradient(180deg,#fde8ec 0%,#fff6ee 45%,#eef5e9 100%);background-attachment:fixed;}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(16px + var(--sat)) calc(clamp(14px,4vw,40px) + var(--sar)) 16px calc(clamp(14px,4vw,40px) + var(--sal))}
header h1{font-weight:900;font-size:clamp(22px,3.2vw,34px);letter-spacing:.08em;display:flex;align-items:baseline;gap:12px}
header h1 small{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:.2em}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{position:relative;font:inherit;font-size:15px;padding:9px 16px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.65);cursor:pointer;transition:.2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px}
nav button.active{background:var(--peach2);color:#fff;border-color:var(--peach2);box-shadow:0 6px 16px rgba(224,96,126,.35)}
nav button .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#fff;color:var(--peach2);font-size:12px;font-weight:700;line-height:20px}
main{position:relative;z-index:1;padding:8px calc(clamp(14px,4vw,40px) + var(--sar)) 60px calc(clamp(14px,4vw,40px) + var(--sal));max-width:1100px;margin:0 auto}
section.view{display:none;animation:fade .4s ease}
section.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{font:inherit;font-size:15px;padding:10px 18px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.18s;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.btn.primary{background:var(--peach2);color:#fff;border-color:var(--peach2)}
.btn.leaf{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.violet{background:var(--violet);color:#fff;border-color:var(--violet)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{font-size:13px;padding:6px 12px;min-height:36px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn:active:not(:disabled),.opt:active:not(:disabled),.chip:active,.mini:active,nav button:active{transform:scale(.97)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:10px 0 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:13px;padding:8px 14px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.counter{font-size:14px;color:var(--muted);letter-spacing:.1em}

/* 字卡 */
.card{width:min(760px,94vw);height:min(600px,78vh);height:min(600px,78dvh);position:relative;perspective:1800px;margin:0 auto;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.card-inner{position:absolute;inset:0;transition:transform .75s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--paper);
  box-shadow:0 24px 60px rgba(120,60,70,.18),0 0 0 1px rgba(0,0,0,.04);padding:26px 30px;display:flex;flex-direction:column;overflow:hidden;transform:translateZ(0)}
.face::before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,74,.35);border-radius:16px;pointer-events:none}
.face.back{transform:rotateY(180deg)}
/* Safari：隱藏面不接收觸控，避免誤觸 */
.card:not(.flipped) .face.back,.card.flipped .face.front{pointer-events:none}
.face .tag{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:700}
.front .sentence{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.front .sentence .text{font-size:clamp(26px,5vw,48px);font-weight:700;letter-spacing:.12em;line-height:1.5}
mark{background:linear-gradient(transparent 55%,var(--peach) 55%);color:var(--peach2);padding:0 .08em;border-radius:3px;font-weight:900}
.front .pic{font-size:clamp(34px,6vw,58px);letter-spacing:.1em;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.front .ask{font-size:16px;color:var(--muted)}
.front .hint{text-align:center;font-size:13px;color:var(--muted);letter-spacing:.2em}
.mastered-stamp{position:absolute;top:22px;right:26px;transform:rotate(12deg);border:3px solid var(--ok);color:var(--ok);font-weight:900;padding:4px 10px;border-radius:8px;letter-spacing:.2em;opacity:0;transition:.3s;font-size:14px}
.card.mastered .mastered-stamp{opacity:.9}
.back .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:6px;margin-top:8px;cursor:auto;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.back .scroll::-webkit-scrollbar{width:6px}.back .scroll::-webkit-scrollbar-thumb{background:var(--peach);border-radius:3px}
.block{margin-bottom:14px}
.block h4{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px;font-weight:700;display:flex;align-items:center;gap:8px}
.block h4::after{content:"";flex:1;height:1px;background:var(--line)}
.defs{display:flex;flex-direction:column;gap:6px}
.def{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;font-size:18px}
.def .w{font-size:30px;font-weight:900;color:var(--peach2);line-height:1}
.def .m{font-weight:600}
.pos{font-size:12px;background:var(--peach3);color:var(--peach2);padding:2px 8px;border-radius:999px;font-family:'Noto Sans TC',sans-serif}
.orig{font-size:16px;line-height:1.8}.orig .s{font-weight:700}.orig .tr{color:#4a4340}
.ex{padding:8px 12px;border-left:3px solid var(--peach);background:rgba(247,168,184,.10);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:15px;line-height:1.7}
.ex.ch{border-left-color:var(--violet);background:rgba(107,91,181,.08)}
.ex .t{font-weight:600}.ex .src{color:var(--muted);font-size:13px;margin-left:6px}.ex .note{color:#5a504c;font-size:13.5px}
.ex .lab{font-size:11px;background:var(--violet3);color:var(--violet);padding:1px 7px;border-radius:999px;margin-right:6px;font-family:'Noto Sans TC',sans-serif;vertical-align:middle}
.illu{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fff4f6,#f1f7ee);border-radius:14px;padding:12px 16px}
.illu .emo{font-size:40px;letter-spacing:.06em;flex-shrink:0}.illu .tip{font-size:15px;line-height:1.6}
.card-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.kbd,.swipe-hint{font-family:'Noto Sans TC',sans-serif;font-size:11px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:.05em}
.swipe-hint{display:none}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:18px;background:rgba(255,255,255,.6);border-radius:20px}

/* 測驗 */
.panel{background:rgba(255,250,243,.92);border-radius:24px;padding:28px clamp(18px,4vw,40px);box-shadow:0 20px 50px rgba(120,60,70,.14);max-width:820px;margin:0 auto}
.panel h2{font-size:24px;letter-spacing:.15em;margin-bottom:16px;font-weight:900}
.setup-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.setup-row label.lbl{min-width:90px;color:var(--muted);font-size:14px;letter-spacing:.1em}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:10px 14px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;user-select:none;-webkit-user-select:none}
.opt-toggle input{accent-color:var(--peach2);width:18px;height:18px}
.opt-toggle:has(input:checked){border-color:var(--peach2);background:var(--peach3)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:10px 0 18px}
.mode{position:relative;display:block;cursor:pointer;-webkit-user-select:none;user-select:none}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode .box{border:2px solid var(--line);border-radius:18px;padding:18px;background:#fff;transition:.2s;height:100%}
.mode .box h3{font-size:19px;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.mode .box p{font-size:14px;color:#5a504c;line-height:1.7}
.mode .box .lv{font-size:12px;padding:2px 10px;border-radius:999px;font-family:'Noto Sans TC',sans-serif}
.mode.basic .lv{background:var(--peach3);color:var(--peach2)}.mode.chal .lv{background:var(--violet3);color:var(--violet)}
.mode input:checked + .box{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.10)}
.mode.basic input:checked + .box{border-color:var(--peach2)}
.mode.chal input:checked + .box{border-color:var(--violet)}
.progress{height:10px;background:rgba(0,0,0,.06);border-radius:999px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--peach2));width:0;transition:width .4s}
.progress.chal i{background:linear-gradient(90deg,#b4a7ea,var(--violet))}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);letter-spacing:.1em}
.qtype{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--peach3);color:var(--peach2);font-family:'Noto Sans TC',sans-serif;margin-bottom:10px}
.qtype.chal{background:var(--violet3);color:var(--violet)}
.stem{font-size:clamp(20px,3vw,28px);line-height:1.7;font-weight:700;margin-bottom:6px}
.stem-src{font-size:14px;color:var(--muted);margin-bottom:18px;min-height:1em}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.opt{font:inherit;text-align:left;font-size:17px;padding:14px 16px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:.18s;display:flex;gap:12px;align-items:center}
.opt .n{width:28px;height:28px;border-radius:50%;background:var(--peach3);color:var(--peach2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-family:'Noto Sans TC',sans-serif;flex-shrink:0}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:#eaf7ee}.opt.correct .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdeeee;animation:shake .4s}.opt.wrong .n{background:var(--bad);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:18px;padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);display:none;line-height:1.8;font-size:15px}
.feedback.show{display:block;animation:fade .3s}
.feedback .head{font-size:18px;font-weight:900;margin-bottom:6px}
.feedback.good .head{color:var(--ok)}.feedback.badf .head{color:var(--bad)}
.feedback .link{background:var(--violet3);border-radius:10px;padding:8px 12px;margin-top:8px}
.result-top{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;margin:10px 0 22px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--peach2) 0%,#f3dfe3 0);position:relative}
.ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--paper)}
.ring span{position:relative;font-size:34px;font-weight:900;color:var(--peach2)}
.ring span small{font-size:14px;color:var(--muted);display:block;text-align:center;font-weight:500}
.result-msg{font-size:20px;line-height:1.7;max-width:420px}
.wrong-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wrong-item{background:#fff;border-radius:14px;padding:14px 16px;border-left:4px solid var(--bad);font-size:15px;line-height:1.7}
.wrong-item .q{font-weight:700;font-size:17px}
.wrong-item .ans span{display:inline-block;padding:1px 8px;border-radius:6px;margin-right:6px;font-size:14px}
.wrong-item .ans .you{background:#fdeeee;color:var(--bad);text-decoration:line-through}
.wrong-item .ans .ok{background:#eaf7ee;color:var(--ok)}
.wrong-item .meta{font-size:13px;color:var(--muted)}
.wrong-item .act{margin-top:6px}

/* 錯題本／進度 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mini{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line);cursor:pointer;transition:.18s;position:relative}
.mini .s{font-size:18px;font-weight:700;letter-spacing:.05em}
.mini .w{font-size:13px;color:var(--muted);margin-top:6px}
.mini .cnt{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-size:12px;border-radius:999px;padding:2px 8px;font-family:'Noto Sans TC',sans-serif}
.mini.m{border-color:var(--ok)}.mini.m .cnt{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:16px;padding:18px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:34px;color:var(--peach2);font-weight:900}
.stat span{font-size:13px;color:var(--muted);letter-spacing:.15em}
.hist-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table.hist{width:100%;min-width:480px;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
table.hist th,table.hist td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.hist th{background:var(--peach3);color:var(--peach2);font-weight:700;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:10px;letter-spacing:.1em}

/* 自製確認視窗（取代 iOS 會攔截的 confirm） */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,37,34,.45);display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s}
.modal[hidden]{display:none}
.modal-box{background:var(--paper);border-radius:20px;padding:24px 22px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-msg{font-size:17px;line-height:1.7;margin-bottom:18px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-btns .btn{flex:1}

/* 只在有滑鼠的裝置啟用 hover 效果（避免 iPad 上「黏住」） */
@media (hover:hover){
  nav button:hover{transform:translateY(-1px);background:#fff}
  nav button.active:hover{background:var(--peach2)}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.08)}
  .opt:hover:not(:disabled){border-color:var(--peach);transform:translateY(-2px)}
  .mini:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
}
/* 觸控裝置：顯示滑動提示、隱藏鍵盤提示 */
@media (hover:none) and (pointer:coarse){
  .kbd{display:none}.swipe-hint{display:block}
}

/* 手機／直向 iPad mini：底部分頁列 */
@media (max-width:720px){
  header{padding:calc(10px + var(--sat)) 14px 4px;justify-content:center}
  header h1{font-size:22px;flex-direction:column;align-items:center;gap:0;text-align:center}
  header h1 small{font-size:12px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    background:rgba(255,250,243,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal))}
  nav button{border:none;background:transparent;border-radius:12px;padding:6px 2px;font-size:11px;flex-direction:column;justify-content:center;gap:2px;min-height:50px;-webkit-backdrop-filter:none;backdrop-filter:none}
  nav button .ico{font-size:22px;line-height:1.1}
  nav button.active{background:var(--peach3);color:var(--peach2);box-shadow:none}
  nav button .badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--bad);color:#fff;font-size:11px;line-height:18px;min-width:18px}
  main{padding:4px 12px calc(96px + var(--sab))}
  footer{display:none}
  .toast{bottom:calc(84px + var(--sab))}
  .card{width:100%;height:clamp(380px,60vh,560px);height:clamp(380px,60dvh,560px)}
  .face{padding:18px 16px;border-radius:20px}
  .front .sentence{gap:12px}
  .front .sentence .text{font-size:clamp(24px,7vw,36px)}
  .front .ask{font-size:14px}
  .card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .card-actions .btn{padding:10px 6px;font-size:14px}
  .card-actions #flipBtn{grid-column:1/-1}
  .def{font-size:16px}.def .w{font-size:26px}
  .panel{padding:20px 16px;border-radius:20px}
  .panel h2{font-size:20px}
  .options{grid-template-columns:1fr}
  .setup-row label.lbl{min-width:100%}
  .result-top{gap:14px}
  .result-msg{font-size:17px;text-align:center}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .card-inner{transition-duration:.2s}
  section.view,.feedback.show{animation:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<header>
  <h1>桃花源記 <small>重點字詞 ‧ 字卡遊戲</small></h1>
  <nav>
    <button data-view="learn" class="active"><span class="ico">📖</span><span class="lbl">學習字卡</span></button>
    <button data-view="quiz"><span class="ico">✍️</span><span class="lbl">自我測考</span></button>
    <button data-view="wrong"><span class="ico">📕</span><span class="lbl">錯題本</span><span class="badge" id="wrongBadge">0</span></button>
    <button data-view="stats"><span class="ico">🌸</span><span class="lbl">學習進度</span></button>
  </nav>
</header>

<main>
  <!-- 學習 -->
  <section class="view active" id="view-learn">
    <div class="toolbar">
      <div class="chips" id="filterChips">
        <button class="chip active" data-f="all">全部字詞</button>
        <button class="chip" data-f="unmastered">未掌握</button>
        <button class="chip" data-f="mastered">已掌握</button>
        <button class="chip" data-f="wrong">錯題</button>
      </div>
      <span class="counter" id="counter"></span>
    </div>
    <div id="cardWrap"></div>
    <div class="card-actions">
      <button class="btn primary" id="flipBtn">🔄 翻轉字卡</button>

/* ===================== 二、儲存／工具（容錯） ===================== */
const STORE_KEY='thy_flashcards_v2';
let storageOK=true;
function emptyProgress(){return {mastered:{},wrong:{},history:[]};}
function normalize(p){const e=emptyProgress();if(!p||typeof p!=='object')return e;
  return {mastered:(p.mastered&&typeof p.mastered==='object')?p.mastered:{},
          wrong:(p.wrong&&typeof p.wrong==='object')?p.wrong:{},
          history:Array.isArray(p.history)?p.history:[]};}
function loadProgress(){try{return normalize(JSON.parse(window.localStorage.getItem(STORE_KEY)));}catch(e){storageOK=false;return emptyProgress();}}
let progress=loadProgress();
function saveProgress(){
  progress=normalize(progress);
  try{window.localStorage.setItem(STORE_KEY,JSON.stringify(progress));storageOK=true;}
  catch(e){ if(storageOK){storageOK=false;toast('⚠️ 瀏覽器不允許儲存（可能是私密瀏覽），進度只保留在本次開啟期間');} }
  try{updateBadge();}catch(e){}
}
function updateBadge(){const b=document.getElementById('wrongBadge');if(b)b.textContent=Object.keys(progress.wrong||{}).length;}
const byId=id=>CARDS.find(c=>c.id===id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);}
function highlight(text,words){let out=esc(text);(words||[]).forEach(wd=>{if(wd&&wd.w)out=out.split(wd.w).join('<mark>'+esc(wd.w)+'</mark>');});return out;}
const isTouch=matchMedia('(hover:none) and (pointer:coarse)').matches;

/* 自製確認視窗：iOS App 內置瀏覽器常攔截 confirm()，故改用頁內對話框 */
function askConfirm(msg,onYes){
  const m=document.getElementById('modal'),yes=document.getElementById('modalYes'),no=document.getElementById('modalNo');
  document.getElementById('modalMsg').textContent=msg;m.hidden=false;
  const close=()=>{m.hidden=true;yes.onclick=no.onclick=m.onclick=null;document.removeEventListener('keydown',esc_);};
  const esc_=e=>{if(e.key==='Escape')close();};
  yes.onclick=()=>{close();try{onYes();}catch(e){toast('操作失敗，請重試');}};
  no.onclick=close;m.onclick=e=>{if(e.target===m)close();};
  document.addEventListener('keydown',esc_);
  setTimeout(()=>{try{yes.focus();}catch(e){}},50);
}

/* ===================== 三、音效（iOS 需於手勢中喚醒） ===================== */
let actx=null;
function beep(type){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
 const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
 if(type==='ok'){o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.1);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36);}
 else{o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(150,t+.25);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.31);}
}catch(e){}}

/* ===================== 四、Three.js 桃花瓣背景（行動裝置省電版） ===================== */
const Petals=(()=>{
  try{
  if(typeof THREE==='undefined')throw new Error('no three');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.getElementById('bg');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);camera.position.set(0,0,22);
  scene.add(new THREE.AmbientLight(0xffffff,1));
  function petalTexture(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
    const grad=g.createRadialGradient(64,80,4,64,64,64);grad.addColorStop(0,'#fff1f4');grad.addColorStop(.6,'#f9b7c6');grad.addColorStop(1,'#ef8aa3');
    g.fillStyle=grad;g.beginPath();g.moveTo(64,8);g.bezierCurveTo(118,30,118,90,64,122);g.bezierCurveTo(10,90,10,30,64,8);g.closePath();g.fill();
    g.strokeStyle='rgba(224,96,126,.35)';g.lineWidth=2;g.beginPath();g.moveTo(64,20);g.quadraticCurveTo(60,64,64,112);g.stroke();return new THREE.CanvasTexture(c);}
  const tex=petalTexture(),geo=new THREE.PlaneGeometry(1,1);
  const petals=[],N=reduced?25:(innerWidth<600?45:innerWidth<1100?80:130),H=16,W=24;
  function makePetal(){const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.85});
    mat.color.setHSL(0.95+Math.random()*.05,.7,.75+Math.random()*.2);const m=new THREE.Mesh(geo,mat);const s=.35+Math.random()*.55;m.scale.set(s,s*1.2,1);scene.add(m);return m;}
  function reset(p,top){p.mesh.position.set((Math.random()-.5)*W*1.6,top?H+Math.random()*4:(Math.random()-.5)*H*2,(Math.random()-.5)*14-2);
    p.vy=.015+Math.random()*.03;p.sway=Math.random()*Math.PI*2;p.swaySpeed=.4+Math.random()*.8;p.rx=(Math.random()-.5)*.03;p.ry=(Math.random()-.5)*.04;p.rz=(Math.random()-.5)*.02;}
  for(let i=0;i<N;i++){const p={mesh:makePetal()};reset(p,false);petals.push(p);}
  const bursts=[];
  function burst(){const n=isTouch?24:40;for(let i=0;i<n;i++){const m=makePetal();m.position.set((Math.random()-.5)*2,(Math.random()-.5)*2,4);const a=Math.random()*Math.PI*2,sp=.15+Math.random()*.25;
    bursts.push({mesh:m,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+.15,vz:(Math.random()-.5)*.2,life:1,rx:(Math.random()-.5)*.3,ry:(Math.random()-.5)*.3});}}
  let mx=0,my=0;if(!isTouch)window.addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);});
  function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);}
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,300));resize();
  const clock=new THREE.Clock();let rafId=0;
  function loop(){rafId=requestAnimationFrame(loop);const t=clock.getElapsedTime();
    petals.forEach(p=>{const m=p.mesh;m.position.y-=p.vy;m.position.x+=Math.sin(t*p.swaySpeed+p.sway)*.012;m.rotation.x+=p.rx;m.rotation.y+=p.ry;m.rotation.z+=p.rz;if(m.position.y<-H-2)reset(p,true);});
    for(let i=bursts.length-1;i>=0;i--){const b=bursts[i],m=b.mesh;m.position.x+=b.vx;m.position.y+=b.vy;m.position.z+=b.vz;b.vy-=.008;m.rotation.x+=b.rx;m.rotation.y+=b.ry;b.life-=.016;m.material.opacity=Math.max(0,b.life);
      if(b.life<=0){scene.remove(m);m.material.dispose();bursts.splice(i,1);}}
    camera.position.x+=(mx*2-camera.position.x)*.03;camera.position.y+=(-my*1.5-camera.position.y)*.03;camera.lookAt(0,0,0);renderer.render(scene,camera);}
  /* 切到背景／鎖屏時暫停，節省電量 */
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(rafId);rafId=0;}else if(!rafId){clock.getDelta();loop();}});
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cancelAnimationFrame(rafId);rafId=0;},false);
  canvas.addEventListener('webglcontextrestored',()=>{if(!rafId)loop();},false);
  loop();
  return {burst};
  }catch(e){return {burst(){}};}
})();
function safeBurst(){try{Petals.burst();}catch(e){}}

function showView(name){

/* ===================== 六、學習模式 ===================== */
const Learn={filter:'all',customIds:null,list:[],idx:0,flipped:false,swiped:false};
function filteredCards(){
  if(Learn.customIds)return Learn.customIds.map(byId).filter(Boolean);
  switch(Learn.filter){case 'mastered':return CARDS.filter(c=>progress.mastered[c.id]);case 'unmastered':return CARDS.filter(c=>!progress.mastered[c.id]);
    case 'wrong':return CARDS.filter(c=>progress.wrong[c.id]);default:return CARDS.slice();}
}
function setFilter(f,customIds=null){Learn.filter=f;Learn.customIds=customIds;Learn.list=filteredCards();Learn.idx=0;Learn.flipped=false;
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.toggle('active',!customIds&&c.dataset.f===f));renderCard();}

function renderCard(){

  if(!list.length){wrap.innerHTML='<div class="empty">🌸 此分類暫時沒有字卡。<br><small>試試切換到「全部字詞」。</small></div>';counter.textContent='';return;}

    .map(w=>`<div class="ex ch"><span class="lab">${w.ch.src?'課本篇章':'自擬句'}</span><span class="t">${highlight(w.ch.t,c.words)}</span>${w.ch.src?`<span class="src">${esc(w.ch.src)}</span>`:''}</div>`).join('');
  wrap.innerHTML=`
  <div class="card ${Learn.flipped?'flipped':''} ${mastered?'mastered':''}" id="card">
    <div class="card-inner">
      <div class="face front">
        <div class="tag">原　句</div><div class="mastered-stamp">已掌握</div>
        <div class="sentence">
          <div class="text">${highlight(c.s,c.words)}</div>
          <div class="pic">${c.pic}</div>
          <div class="ask">「${c.words.map(w=>w.w).join('」、「')}」在句中是甚麼意思？</div>
        </div>
        <div class="hint">— ${isTouch?'點一下':'點擊'}字卡翻轉查看解釋 —</div>
      </div>
      <div class="face back">
        <div class="tag">字　解　<span style="color:var(--muted);font-weight:400;letter-spacing:0">（${isTouch?'點一下標題處':'點擊'}可翻回正面）</span></div>
        <div class="scroll">
          <div class="block"><div class="defs">${c.words.map(w=>`<div class="def"><span class="w">${w.w}</span><span class="m">${esc(w.m)}</span><span class="pos">${esc(w.pos)}</span></div>`).join('')}</div></div>
          <div class="block"><h4>原文語譯</h4><div class="orig"><div class="s">${highlight(c.s,c.words)}</div><div class="tr">${esc(c.tr)}</div></div></div>
          <div class="block"><h4>文言例句（同一用法）</h4>${c.ex.map(e=>`<div class="ex"><span class="t">${highlight(e.t,[{w:e.w||c.words[0].w},...c.words])}</span><span class="src">${esc(e.src)}</span>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div>`).join('')}</div>
          <div class="block"><h4>挑戰模式例句</h4>${chHtml}</div>
          <div class="block"><h4>趣味圖解</h4><div class="illu"><div class="emo">${c.pic}</div><div class="tip">${esc(c.tip)}</div></div></div>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('card').addEventListener('click',e=>{if(Learn.swiped)return;if(e.target.closest('.scroll')&&Learn.flipped)return;flipCard();});
  document.getElementById('masterBtn').textContent=mastered?'↩ 取消已掌握':'✔ 標記已掌握';
}
function flipCard(){Learn.flipped=!Learn.flipped;const card=document.getElementById('card');if(card)card.classList.toggle('flipped',Learn.flipped);}
function nextCard(d){if(!Learn.list.length)return;Learn.idx=(Learn.idx+d+Learn.list.length)%Learn.list.length;Learn.flipped=false;renderCard();}
document.getElementById('prevBtn').onclick=()=>nextCard(-1);
document.getElementById('nextBtn').onclick=()=>nextCard(1);
document.getElementById('flipBtn').onclick=flipCard;
document.getElementById('shuffleBtn').onclick=()=>{shuffle(Learn.list);Learn.idx=0;Learn.flipped=false;renderCard();toast('已洗牌 🔀');};
document.getElementById('masterBtn').onclick=toggleMaster;
function toggleMaster(){const c=Learn.list[Learn.idx];if(!c)return;
  if(progress.mastered[c.id]){delete progress.mastered[c.id];toast('已取消標記');}else{progress.mastered[c.id]=Date.now();toast('太好了！已標記為掌握 ✔');safeBurst();}
  saveProgress();renderCard();}

/* 觸控：左右滑動切換字卡 */
(function(){
  const wrap=document.getElementById('cardWrap');let sx=0,sy=0,st=0,multi=false;
  wrap.addEventListener('touchstart',e=>{multi=e.touches.length>1;const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});

    if(Math.abs(dx)>55&&Math.abs(dy)<60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-st<700){

document.addEventListener('keydown',e=>{

    if(e.key==='ArrowRight')nextCard(1);else if(e.key==='ArrowLeft')nextCard(-1);

/* ===================== 七、測驗模式（基礎／挑戰） ===================== */
const Quiz={mode:'basic',qs:[],i:0,score:0,wrong:[],answered:false,scope:'all'};
const ALL_WORDS=CARDS.flatMap(c=>c.words.map((w,wi)=>({cid:c.id,wi,...w})));
function distractors(correct,n){const pool=[],seen=new Set([correct.m]);
  shuffle(ALL_WORDS.slice()).forEach(w=>{if(w.k!==correct.k&&!seen.has(w.m)){seen.add(w.m);pool.push(w.m);}});return pool.slice(0,n);}
function buildQuestions(scope,count,mode){
  let items=ALL_WORDS.slice();
  if(scope==='wrong')items=items.filter(w=>progress.wrong[w.cid]);
  else if(scope==='unmastered')items=items.filter(w=>!progress.mastered[w.cid]);
  else if(Array.isArray(scope))items=items.filter(w=>scope.includes(w.cid));
  shuffle(items);if(count!=='all')items=items.slice(0,+count);
  return items.map(w=>{
    const c=byId(w.cid);const opts=shuffle([w.m,...distractors(w,3)]);let stem,src;
    const ch=w.ch||{t:c.s,src:'陶淵明《桃花源記》'};
    if(mode==='basic'){stem=`「${highlight(c.s,[w])}」中，「<mark>${esc(w.w)}</mark>」的意思是？`;src='——陶淵明《桃花源記》';}
    else{stem=`「${highlight(ch.t,[w])}」中，「<mark>${esc(w.w)}</mark>」的意思是？`;src=ch.src?'——'+ch.src:'';}
    return {w,c,ch,mode,opts,stem,src,answer:w.m};
  });
}
function startQuiz(scope,mode){
  const count=document.querySelector('input[name=qn]:checked').value;
  mode=mode||document.querySelector('input[name=mode]:checked').value;
  scope=scope||document.querySelector('input[name=scope]:checked').value;
  const qs=buildQuestions(scope,count,mode);
  if(!qs.length){toast('此範圍沒有可測驗的字詞');return;}
  Object.assign(Quiz,{qs,i:0,score:0,wrong:[],mode,scope});
  document.getElementById('quizSetup').style.display='none';document.getElementById('quizResult').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  document.getElementById('qProg').classList.toggle('chal',mode==='chal');
  showView('quiz');renderQuestion();
}
function renderQuestion(){
  const q=Quiz.qs[Quiz.i];Quiz.answered=false;
  document.getElementById('qIndex').textContent=`第 ${Quiz.i+1} / ${Quiz.qs.length} 題`;
  document.getElementById('qScore').textContent=`得分 ${Quiz.score}`;
  document.getElementById('qBar').style.width=(Quiz.i/Quiz.qs.length*100)+'%';
  const qt=document.getElementById('qType');qt.textContent=q.mode==='basic'?'🌸 基礎模式 ‧ 原文句':'⚔️ 挑戰模式 ‧ 文言例句遷移';qt.className='qtype'+(q.mode==='chal'?' chal':'');
  document.getElementById('qStem').innerHTML=q.stem;document.getElementById('qSrc').textContent=q.src;
  document.getElementById('qOptions').innerHTML=q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span><span>${esc(o)}</span></button>`).join('');
  document.querySelectorAll('#qOptions .opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
  const fb=document.getElementById('qFeedback');fb.className='feedback';fb.innerHTML='';
  document.getElementById('nextQ').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- 作答（任何一步出錯都保證能進入下一題） ---- */
function answer(i){
  if(Quiz.answered)return;Quiz.answered=true;
  const q=Quiz.qs[Quiz.i],chosen=q.opts[i],ok=chosen===q.answer;

  try{document.querySelectorAll('#qOptions .opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong');});}catch(e){}

  if(ok){Quiz.score++;safeBurst();beep('ok');}
  else{
    beep('bad');
    Quiz.wrong.push({q,chosen});
    try{progress.wrong=progress.wrong||{};progress.wrong[q.c.id]=(progress.wrong[q.c.id]||0)+1;}catch(e){}
    saveProgress();
  }

  try{
    const fb=document.getElementById('qFeedback');fb.className='feedback show '+(ok?'good':'badf');
    const chT=q.ch&&q.ch.t?q.ch.t:'',chS=q.ch&&q.ch.src?q.ch.src:'';
    fb.innerHTML=`<div class="head">${ok?'🌸 答對了！':'❌ 答錯了'}</div>
      <div><b>${esc(q.w.w)}</b>：${esc(q.w.m)} <span class="pos">${esc(q.w.pos)}</span></div>
      ${q.mode==='chal'
        ?`<div class="link">🔗 此用法與《桃花源記》「${highlight(q.c.s,[q.w])}」相同。<br>語譯：${esc(q.c.tr)}</div>`
        :`<div>語譯：${esc(q.c.tr)}</div>${chT?`<div class="link">⚔️ 試一試遷移：「${highlight(chT,[q.w])}」${chS?'<span style="color:var(--muted);font-size:13px">（'+esc(chS)+'）</span>':''}</div>`:''}`}
      <div style="color:var(--muted)">💡 ${esc(q.c.tip)}</div>`;
    /* 手機上回饋可能在畫面下方，自動捲到可見處 */
    if(isTouch)setTimeout(()=>{try{fb.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},80);
  }catch(e){
    const fb=document.getElementById('qFeedback');fb.className='feedback show '+(ok?'good':'badf');
    fb.innerHTML=`<div class="head">${ok?'🌸 答對了！':'❌ 答錯了'}</div><div>正確答案：${esc(q.answer)}</div>`;
  }

  document.getElementById('qScore').textContent=`得分 ${Quiz.score}`;
  const n=document.getElementById('nextQ');n.style.display='inline-block';n.textContent=Quiz.i===Quiz.qs.length-1?'查看結果 🏁':'下一題 ▶';
}
document.getElementById('nextQ').onclick=()=>{Quiz.i++;if(Quiz.i>=Quiz.qs.length)showResult();else renderQuestion();};
document.getElementById('startQuiz').onclick=()=>startQuiz();
document.getElementById('quitQuiz').onclick=()=>askConfirm('確定結束本次測驗？已作答的題目會計入結果。',()=>showResult(true));

function showResult(early){
  const total=early?Quiz.i+(Quiz.answered?1:0):Quiz.qs.length;
  document.getElementById('quizPlay').style.display='none';document.getElementById('quizResult').style.display='block';
  document.getElementById('resultTitle').textContent=`🏁 測驗結果 ‧ ${MODE_NAME[Quiz.mode]}`;
  const pct=total?Math.round(Quiz.score/total*100):0;
  document.getElementById('ring').style.background=`conic-gradient(${Quiz.mode==='chal'?'var(--violet)':'var(--peach2)'} ${pct}%, #f3dfe3 0)`;
  document.getElementById('ringText').innerHTML=`${pct}%<small>${Quiz.score} / ${total}</small>`;
  const msg=pct===100?(Quiz.mode==='chal'?'🏆 挑戰全對！你已能把字義靈活遷移到其他文言篇章，功力深厚！':'🏆 全對！基礎穩如桃花源的良田美池。試試挑戰模式吧！')
    :pct>=80?'🌸 很好！只差一點點就完美，看看錯題再衝一次。':pct>=60?'🌱 不錯，基礎穩固；把錯題翻一翻，溫故知新。':'📖 別氣餒！漁人也要「處處誌之」才記得路，多翻幾次字卡就會記住。';
  document.getElementById('resultMsg').innerHTML=msg;
  if(total){progress.history.unshift({d:Date.now(),t:total,s:Quiz.score,m:Quiz.mode});progress.history=progress.history.slice(0,30);saveProgress();}
  document.getElementById('switchMode').textContent=Quiz.mode==='basic'?'⚔️ 轉挑戰模式再測同範圍':'🌸 轉基礎模式再測同範圍';
  document.getElementById('wrongTitle').style.display=Quiz.wrong.length?'block':'none';
  document.getElementById('retestWrong').disabled=!Quiz.wrong.length;document.getElementById('reviewWrongCards').disabled=!Quiz.wrong.length;
  try{
    document.getElementById('wrongList').innerHTML=Quiz.wrong.length?Quiz.wrong.map((w,i)=>`<div class="wrong-item">
      <div class="q">${i+1}. ${w.q.stem}</div><div class="meta">${esc(w.q.src)||'（自擬文言句）'}</div>
      <div class="ans">你的答案：<span class="you">${esc(w.chosen)}</span> 正確答案：<span class="ok">${esc(w.q.answer)}</span></div>
      <div class="meta">《桃花源記》原句：${highlight(w.q.c.s,[w.q.w])}｜語譯：${esc(w.q.c.tr)}｜詞性：${esc(w.q.w.pos)}</div>
      <div class="meta">💡 ${esc(w.q.c.tip)}</div>
      <div class="act"><button class="btn small" onclick="openCard(${w.q.c.id})">📖 打開此字卡</button></div></div>`).join('')
      :'<div class="empty" style="padding:30px">🎉 沒有錯題！</div>';
  }catch(e){document.getElementById('wrongList').innerHTML='<div class="empty" style="padding:30px">（錯題清單顯示失敗，可到「錯題本」查看）</div>';}
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('reviewWrongCards').onclick=()=>{setFilter('custom',uniqueWrongIds());showView('learn');toast('檢討模式：逐張翻閱錯題字卡');};

/* ===================== 八、錯題本／進度 ===================== */
function renderWrongBook(){
  const ids=Object.keys(progress.wrong).map(Number),g=document.getElementById('wrongGrid');
  if(!ids.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">📗 錯題本是空的——做個測驗試試看！</div>';return;}

    <span class="cnt">${progress.mastered[id]?'✔ 已掌握':'錯 '+progress.wrong[id]+' 次'}</span>
    <div class="s">${highlight(c.s,c.words)}</div><div class="w">${c.words.map(w=>w.w+'：'+w.m).join('；')}</div></div>`;}).join('');

function quizWrong(mode){if(!Object.keys(progress.wrong).length){toast('錯題本是空的');return;}

function renderStats(){
  const m=Object.keys(progress.mastered).length,w=Object.keys(progress.wrong).length;
  const bestOf=mode=>{const h=progress.history.filter(x=>x.m===mode&&x.t);return h.length?Math.max(...h.map(x=>Math.round(x.s/x.t*100)))+'%':'—';};
  document.getElementById('statCards').innerHTML=`
    <div class="stat"><b>${m}<span style="font-size:16px;display:inline">/${CARDS.length}</span></b><span>已掌握字卡</span></div>

    <div class="stat"><b>${progress.history.length}</b><span>測驗次數</span></div>

  document.getElementById('histBody').innerHTML=progress.history.length?progress.history.map(h=>`<tr><td>${new Date(h.d).toLocaleString('zh-HK',{hour12:false})}</td><td>${MODE_NAME[h.m]||'—'}</td><td>${h.t}</td><td>${h.s}</td><td>${h.t?Math.round(h.s/h.t*100):0}%</td></tr>`).join('')

/* 重設所有進度：改用自製對話框（不依賴 confirm），並徹底清除 */
document.getElementById('resetAll').addEventListener('click',()=>{
  askConfirm('確定重設所有學習進度？（包括已掌握、錯題本、測驗紀錄，此操作無法復原）',()=>{

    toast('✅ 已重設所有進度');
  });
});
